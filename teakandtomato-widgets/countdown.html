<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown · TEAK AND TOMATO</title>
<!-- Usage: countdown.html?date=2027-02-14&label=days%20to%20move-in -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:transparent; }
  #wrap { text-align:center; padding:16px 0 12px;
          font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing:.04em; }
  #digits { display:flex; justify-content:center; gap:8px; cursor:pointer; }
  #label { margin-top:14px; font-size:14px; font-weight:700; color:#4A3426; }
  #date  { margin-top:4px; font-size:12px; color:#8A7564; }
  .flap { position:relative; width:52px; height:68px; perspective:300px; }
  .half { position:absolute; left:0; right:0; height:50%; overflow:hidden; text-align:center;
          background:#B8743F; color:#F4EEE3; font:italic 600 46px 'Bricolage Grotesque', ui-sans-serif, sans-serif; font-synthesis:style; }
  .half span { display:block; height:68px; line-height:68px; }
  .top    { top:0;    border-radius:10px 10px 0 0; }
  .bottom { bottom:0; border-radius:0 0 10px 10px; }
  .bottom span, .unfold span { transform:translateY(-34px); }
  .fold   { top:0; border-radius:10px 10px 0 0; transform-origin:50% 100%; z-index:2; backface-visibility:hidden; }
  .unfold { bottom:0; border-radius:0 0 10px 10px; transform-origin:50% 0%; z-index:2; transform:rotateX(90deg); backface-visibility:hidden; }
  .flap::after { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(74,52,38,.35); z-index:3; }
  .go .fold   { animation:fold .32s ease-in forwards; }
  .go .unfold { animation:unfold .32s ease-out .32s forwards; }
  @keyframes fold   { to { transform:rotateX(-90deg); } }
  @keyframes unfold { to { transform:rotateX(0deg); } }
</style>
</head>
<body>
<div id="wrap"><div id="digits" title="click to replay"></div><div id="label"></div><div id="date"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const DATE  = q.get("date")  || "2027-02-14";
  const LABEL = q.get("label") || "days to move-in";
  function flap(from, to){
    const f = document.createElement("div"); f.className = "flap";
    [["top", to], ["bottom", from], ["fold", from], ["unfold", to]].forEach(([c, t]) => {
      const h = document.createElement("div"); h.className = "half " + c;
      const s = document.createElement("span"); s.textContent = t; h.appendChild(s); f.appendChild(h);
    });
    return f;
  }
  function daysLeft(){
    const target = new Date(DATE + "T00:00:00"), today = new Date(); today.setHours(0,0,0,0);
    return { days: Math.round((target - today) / 86400000), target };
  }
  function render(){
    const { days, target } = daysLeft();
    const row = document.getElementById("digits"), label = document.getElementById("label");
    row.innerHTML = "";
    if (isNaN(days)) { label.textContent = "add ?date=YYYY-MM-DD"; return; }
    if (days < 0)    { label.textContent = "welcome home"; return; }
    String(days).padStart(3, "0").split("").forEach((d, i) => {
      const f = flap(String((+d + 1) % 10), d); row.appendChild(f);
      setTimeout(() => f.classList.add("go"), 150 + i * 180);
      setTimeout(() => { f.querySelector(".bottom span").textContent = d; }, 790 + i * 180);
    });
    label.textContent = days === 1 ? LABEL.replace(/^days/, "day") : LABEL;
    document.getElementById("date").textContent = target.toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
  }
  document.getElementById("digits").addEventListener("click", render);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(render);
  let last = daysLeft().days;
  setInterval(() => { const d = daysLeft().days; if (d !== last) { last = d; render(); } }, 60000);
</script>
</body>
</html>
