<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock · TEAK AND TOMATO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:transparent; }
  #wrap { text-align:center; padding:14px 0 10px;
          font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing:.04em; }
  svg { width:150px; height:150px; display:block; margin:0 auto; overflow:visible; }
  #date { margin-top:12px; font-size:13px; font-weight:700; color:#8A7564; }
</style>
</head>
<body>
<div id="wrap">
  <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="92" fill="#2F5D46"/>
    <g fill="#F4EEE3" font-family="'Bricolage Grotesque', ui-sans-serif, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
      <text x="100" y="37">12</text><text x="170" y="108">3</text><text x="100" y="180">6</text><text x="30" y="108">9</text>
    </g>
    <line id="h" x1="100" y1="100" x2="100" y2="60" stroke="#F4EEE3" stroke-width="6" stroke-linecap="round"/>
    <line id="m" x1="100" y1="100" x2="100" y2="40" stroke="#F4EEE3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="6" fill="#C9502E"/>
  </svg>
  <div id="date"></div>
</div>
<script>
  function tick(){
    const n = new Date(), m = n.getMinutes() + n.getSeconds() / 60, h = (n.getHours() % 12) + m / 60;
    document.getElementById("h").setAttribute("transform", "rotate(" + (h * 30) + " 100 100)");
    document.getElementById("m").setAttribute("transform", "rotate(" + (m * 6) + " 100 100)");
    document.getElementById("date").textContent =
      n.toLocaleDateString("en-US", { weekday:"long" }) + " | " + n.toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
  }
  tick(); setInterval(tick, 5000);
</script>
</body>
</html>
