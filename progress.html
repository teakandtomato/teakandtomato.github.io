<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time progress · TEAK AND TOMATO</title>
<style>
  html, body { margin:0; background:transparent; }
  #wrap { padding:10px 6px; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing:.04em; }
  .row { display:flex; align-items:center; gap:8px; margin:10px 0; }
  .name { width:40px; font-size:12px; font-weight:700; color:#8A7564; }
  .track { flex:1; height:10px; background:#EFE7DA; border-radius:6px; overflow:hidden; }
  .fill { height:100%; width:0; background:#B8743F; border-radius:6px; transition:width 1.2s ease-out; }
  .pct { width:30px; text-align:left; font-size:12px; color:#8A7564; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  function parts(){
    const n = new Date(), d0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    const w0 = new Date(d0); w0.setDate(d0.getDate() - ((d0.getDay() + 6) % 7));
    const m0 = new Date(n.getFullYear(), n.getMonth(), 1), m1 = new Date(n.getFullYear(), n.getMonth() + 1, 1);
    const y0 = new Date(n.getFullYear(), 0, 1), y1 = new Date(n.getFullYear() + 1, 0, 1);
    const p = (a, b) => Math.min(100, Math.max(0, (n - a) / (b - a) * 100));
    return [["day", p(d0, new Date(d0.getTime() + 864e5))], ["week", p(w0, new Date(w0.getTime() + 7 * 864e5))], ["month", p(m0, m1)], ["year", p(y0, y1)]];
  }
  const wrap = document.getElementById("wrap");
  parts().forEach(([name]) => wrap.insertAdjacentHTML("beforeend",
    '<div class="row"><div class="name">' + name + '</div><div class="track"><div class="fill" data-n="' + name + '"></div></div><div class="pct" data-p="' + name + '"></div></div>'));
  function update(){ parts().forEach(([name, v]) => {
    document.querySelector('[data-n="' + name + '"]').style.width = v.toFixed(1) + "%";
    document.querySelector('[data-p="' + name + '"]').textContent = Math.floor(v) + "%"; }); }
  setTimeout(update, 100); setInterval(update, 60000);
</script>
</body>
</html>
